# Phase 0 of fleet-server's docs/containerization-plan.md: build, scan and
# publish the `web` image. Deploys nothing itself: deploy.yml rsyncs the build
# to the box, and, once the site is served from the web container (phase 3),
# also starts this commit's image there.
#
#   <account>.dkr.ecr.af-south-1.amazonaws.com/ghala:raitrack-<sha>   private ECR,
#   immutable tags; pushed only after it serves as non-root and Trivy finds no
#   fixable HIGH or CRITICAL issue. AWS access is per run via GitHub OIDC (the
#   role in the `production` environment secret AWS_ECR_PUSH_ROLE_ARN; main branch only).
#   Without that secret the run builds, tests and scans, then skips the push.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run per COMMIT, never cancelled. Once the site is served from the web
# container, every commit's deploy (deploy.yml -> fleet-web up <sha>) waits for
# that commit's own image. A per-branch group with cancel-in-progress let a
# later push cancel the earlier build: that commit's deploy then waited 20 min
# for an image that never came and failed, and a later push that deploy.yml
# skips (docs, CI files) deploys nothing, so the site stayed on the old image.
# A per-branch group WITHOUT cancelling is no better: GitHub keeps one pending
# run per group and drops the older one.
concurrency:
  group: raitrack-images-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: raitrack              # local name for build, test and scan
  AWS_REGION: af-south-1
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  image:
    name: build, scan, push
    runs-on: ubuntu-latest
    # The `production` environment holds the push role ARN (and, for the web
    # image, the Maps keys) and is limited to the main branch. Running here also
    # makes the OIDC subject `repo:<owner>/<repo>:environment:production`,
    # which is what the AWS trust policy of github-ecr-push accepts.
    environment: production
    permissions:
      contents: read
      id-token: write          # GitHub OIDC token, exchanged for the ECR push role
    env:
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_MYTOMTOM_API_KEY: ${{ secrets.VITE_MYTOMTOM_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: the Maps key is set
        run: |
          [ -n "${VITE_GOOGLE_MAPS_API_KEY}" ] || { echo "::error::VITE_GOOGLE_MAPS_API_KEY is not set"; exit 1; }

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build (local, not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APK_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          secret-envs: |
            VITE_GOOGLE_MAPS_API_KEY=VITE_GOOGLE_MAPS_API_KEY
            VITE_MYTOMTOM_API_KEY=VITE_MYTOMTOM_API_KEY
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: serves the site as a non-root user
        run: |
          set -euo pipefail
          img="${IMAGE}:${GITHUB_SHA}"
          docker run -d --rm --name web --read-only --tmpfs /tmp --cap-drop ALL -p 127.0.0.1:8080:8080 "$img"
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/DEPLOYED_COMMIT | grep -q "${GITHUB_SHA}"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/some/spa/route); [ "$code" = 200 ]
          [ "$(docker exec web id -u)" != 0 ]
          docker stop web

      - name: scan (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
            "${TRIVY_IMAGE}" image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "${IMAGE}:${GITHUB_SHA}"

      - name: AWS push role configured?
        id: gate
        env:
          ROLE: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
        run: |
          if [ -n "${ROLE}" ]; then
            # Public repo, public logs: hide the account id wherever it appears
            # (the registry host in image names), not just the full ARN.
            echo "::add-mask::$(printf '%s' "$ROLE" | cut -d: -f5)"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::environment secret AWS_ECR_PUSH_ROLE_ARN is not set: image built, tested and scanned, not pushed"; fi

      - name: sign in to AWS (OIDC, this run only)
        if: steps.gate.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          role-session-name: raitrack-images-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: log in to ECR
        if: steps.gate.outputs.push == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: push with SBOM and provenance
        if: steps.gate.outputs.push == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.ecr.outputs.registry }}/ghala:raitrack-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APK_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          secret-envs: |
            VITE_GOOGLE_MAPS_API_KEY=VITE_GOOGLE_MAPS_API_KEY
            VITE_MYTOMTOM_API_KEY=VITE_MYTOMTOM_API_KEY
          cache-from: type=gha,scope=web
