# Phase 0 of fleet-server's docs/containerization-plan.md: build, scan and
# publish the `web` image. Deploys nothing: deploy.yml still rsyncs the build
# to the box until phase 3.
#
#   <account>.dkr.ecr.af-south-1.amazonaws.com/raitrack:<sha>   private ECR,
#   immutable tags; pushed only after it serves as non-root and Trivy finds no
#   fixable HIGH or CRITICAL issue. AWS access is per run via GitHub OIDC (the
#   role in the repository variable AWS_ECR_PUSH_ROLE_ARN; main branch only).
#   Without that variable the run builds, tests and scans, then skips the push.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: raitrack-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: raitrack              # local name for build, test and scan
  AWS_REGION: af-south-1
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  image:
    name: build, scan, push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # GitHub OIDC token, exchanged for the ECR push role
    env:
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_MYTOMTOM_API_KEY: ${{ secrets.VITE_MYTOMTOM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: the Maps key is set
        run: |
          [ -n "${VITE_GOOGLE_MAPS_API_KEY}" ] || { echo "::error::VITE_GOOGLE_MAPS_API_KEY is not set"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - name: build (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          secret-envs: |
            VITE_GOOGLE_MAPS_API_KEY=VITE_GOOGLE_MAPS_API_KEY
            VITE_MYTOMTOM_API_KEY=VITE_MYTOMTOM_API_KEY
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: serves the site as a non-root user
        run: |
          set -euo pipefail
          img="${IMAGE}:${GITHUB_SHA}"
          docker run -d --rm --name web --read-only --tmpfs /tmp --cap-drop ALL -p 127.0.0.1:8080:8080 "$img"
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/DEPLOYED_COMMIT | grep -q "${GITHUB_SHA}"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/some/spa/route); [ "$code" = 200 ]
          [ "$(docker exec web id -u)" != 0 ]
          docker stop web

      - name: scan (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
            "${TRIVY_IMAGE}" image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "${IMAGE}:${GITHUB_SHA}"

      - name: AWS push role configured?
        id: gate
        env:
          ROLE: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
        run: |
          if [ -n "${ROLE}" ]; then echo "push=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::AWS_ECR_PUSH_ROLE_ARN is not set: image built, tested and scanned, not pushed"; fi

      - name: sign in to AWS (OIDC, this run only)
        if: steps.gate.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          role-session-name: raitrack-images-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: log in to ECR
        if: steps.gate.outputs.push == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: push with SBOM and provenance
        if: steps.gate.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.ecr.outputs.registry }}/raitrack:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          secret-envs: |
            VITE_GOOGLE_MAPS_API_KEY=VITE_GOOGLE_MAPS_API_KEY
            VITE_MYTOMTOM_API_KEY=VITE_MYTOMTOM_API_KEY
          cache-from: type=gha,scope=web
