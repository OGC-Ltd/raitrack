# Security headers for the site, included by every block in web.conf that
# sends headers: nginx drops the server's add_header lines in any location
# that has its own, so each such location includes this file again.
#
# HSTS matches what the API (helmet) already sends for this host, so it adds
# no new commitment. Browsers ignore it over plain HTTP (the IP / LiteSpeed path).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# REPORT-ONLY: blocks nothing. Browsers post what it would have blocked to the
# API (fleet-server modules/csp), and the policy is tightened from those
# reports before it is switched to Content-Security-Policy.
#   script  'wasm-unsafe-eval': the dashcam player's WASM decoder (public/vss-sdk)
#           maps.googleapis.com/gstatic: the Google satellite layer
#   style   'unsafe-inline': React, Leaflet and Recharts set style attributes
#   connect the dashcam stream (VSS), weather, place names, road data
#   frame   blob: the PDF preview
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https://vss.controltech-ea.com:* wss://vss.controltech-ea.com:* https://api.open-meteo.com https://nominatim.openstreetmap.org https://overpass-api.de https://overpass.private.coffee https://maps.googleapis.com; worker-src 'self' blob:; media-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/v1/csp-report" always;
