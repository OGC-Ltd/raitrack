# The `web` container: new-ui's static files, same cache rules the host nginx
# used (fleet-server deploy/edge, formerly /etc/nginx/fleet/locations.conf).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects must not carry this container's own port (8080) to browsers.
    absolute_redirect off;

    # Vite content-hashes every asset filename, so these are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is the one filename that never changes: it points at each
    # release's hashed bundles, so a cached copy pins the browser to the
    # previous release indefinitely.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
